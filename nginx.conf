server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS, so the logger is resolved per request rather than
    # at startup — nginx must still serve the app if the log sink is down.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Liveness endpoint for container healthchecks (kept above the SPA fallback
    # so it isn't swallowed by try_files).
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # The SPA shell must always be revalidated. Asset filenames are content-hashed
    # and served immutable below, so a cached index.html pins the browser to the
    # old bundle's hashes indefinitely — a deploy then appears to do nothing.
    # nginx sends no Cache-Control here by default, which leaves browsers free to
    # cache heuristically off Last-Modified.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Client log events -> log sink -> rotating files on the mounted volume
    location = /api/logs {
        set $log_sink http://logger:8080;
        proxy_pass $log_sink/api/logs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size 64k;
        proxy_connect_timeout 2s;
        proxy_send_timeout 5s;
        proxy_read_timeout 5s;

        # Logging is best effort: never let it stall or error into the UI
        access_log off;
        proxy_intercept_errors off;
    }
}
